<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hero{
            height: 400px;
            width: 100%;
            margin-top: 50px;
            margin-bottom: 50px;
        }
        #hero-1{
            background-color: aqua;
        }
         #hero-2{
            background-image:url(../lect-3/logo.jpg) ;
            background-repeat: no-repeat;
            background-position: center;
        }
         #hero-3{
            background-image:url(../lect-3/logo.jpg) ;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        #hero-4{
           background: linear-gradient(to bottom,red,rgb(93, 93, 179)) ;
        }
        #hero-5{
           background: radial-gradient(circle,red,rgb(93, 93, 179),white) ;
        }
        #hero-6{
           background: conic-gradient(red,rgb(93, 93, 179),white) ;
        }
    </style>
</head>
<body>
    <div class="hero" id="hero-1"></div>
    <div class="hero" id="hero-2"></div>
    <div class="hero" id="hero-3"></div>
    <div class="hero" id="hero-4"></div>
    <div class="hero" id="hero-5"></div>
    <div class="hero" id="hero-6"></div>
</body>
</html>
