<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 400px;
            width: 100%;
            margin: 20px 0px;
        }
        .box-1{
            background-color: slateblue;
        }
        .box-2{
            background: linear-gradient(to bottom right,blue , white);
        }
        .box-3{
            background: radial-gradient(blue 40%,white);
        }
        .box-4{
            background: conic-gradient(rgb(65, 204, 53),white);
        }
        .box-5{
            background: repeating-linear-gradient(rgb(65, 204, 53),rgb(110, 38, 48),white);
        }
    </style>
</head>
<body>
    <div class="box box-1"></div>
    <div class="box box-2"></div>
    <div class="box box-3"></div>
    <div class="box box-4"></div>
    <div class="box box-5"></div>
</body>
</html>
