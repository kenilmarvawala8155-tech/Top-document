<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <h1 align="center">form example</h1>
        <table border="1" align="center" cellspacing="10px" cellpadding="10px">
            <tr>
                <th>username:</th>
                <td><input type="text" name="" id=""></td>
                <th>email:</th>
                <td><input type="email" name="" id=""></td>
            </tr>
            <tr>
                <th>password:</th>
                <td><input type="password" name="" id=""></td>
                <th>dob:</th>
                <td><input type="date" name="" id=""></td>
            </tr>
            <tr>
                <th>hobby:</th>
                <td><input type="checkbox" name="" id="">sport
                <input type="checkbox" name="" id="">music
                <input type="checkbox" name="" id="">dance
                </td>
                <th>gender:</th>
                <td>
                    <input type="radio" name="" id="">male
                     <input type="radio" name="" id="">female
                </td>
                <tr>
                    <th>address:</th>
                    <td><textarea name="" id=""></textarea></td>
                    <th>city</th>
                    <td>
                        <select name="city" id="">
                            <option value="surat">surat</option>
                            <option value="mumbai">mumbai</option>
                            <option value="daman">daman</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="4">
                        <input type="button" value="submit">
                    </td>
                </tr>
            </tr>
        </table>
    </form>

    <fieldset>
        <legend>extra input</legend>
        <label for="">username:</label>
        <td><input type="text"></td>
        <br><br>
        <label for="">number</label>
        <input type="number">
        <br><br>
    </fieldset>
</body>
</html>
